[package]
name = "aggrs"
version = "0.6.0"
edition = "2021"
authors = ["Nicola Bonelli <nicola.bonelli@larthia.com>"]
description = "A fast command-line tool for building aggregation trees from JSON and CSV data"
license = "MIT"
repository = "https://github.com/awgn/aggrs"
homepage = "https://github.com/awgn/aggrs"
documentation = "https://github.com/awgn/aggrs#readme"
readme = "README.md"
keywords = ["aggregation", "json", "csv", "cli", "data-analysis"]
categories = ["command-line-utilities", "data-structures", "parsing"]
exclude = ["tests/*", "target/*", "*.pcap", "test.json", "test.csv", "test.txt", "diff_test", "skills/*"]

[dependencies]
anyhow = "1.0.104"
ahash = "0.8"
hashbrown = "0.15"
itoa = "1.0"
libc = "0.2"
memchr = "2.8"
clap = { version = "4.6.7", features = ["derive"] }
colored = "3.1.1"
csv = "1.4.0"
rayon = "1.12.0"
regex = "1.13.1"
scopeguard = "1.2.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
smol_str = { version = "0.3.7", features = ["serde"] }
zmij = "1.0"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
debug = false
panic = "abort"
strip = "symbols"
